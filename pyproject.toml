[project]
name = "camoufox-mcp"
version = "0.2.0"
description = "Browser automation MCP server that does not get blocked, backed by Camoufox anti-detect Firefox"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabien Vauchelles" }]
keywords = ["mcp", "browser-automation", "camoufox", "firefox", "anti-detect", "claude-code"]
dependencies = [
    "fastmcp>=3.4.4",
    # camoufox and playwright are bounded together: an unbounded (transitive)
    # playwright once drifted ahead of the installed Camoufox binary's Juggler
    # protocol schema and every launch failed with a Browser.setDefaultViewport
    # protocol error (2026-07-15 incident, see docs/decisions.md).
    "camoufox[geoip]>=0.4.11,<0.5",
    "playwright>=1.58,<1.59",
    "platformdirs>=4.0",
    "filelock>=3.13",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/agelyhq/mcp-camoufox"
Documentation = "https://github.com/agelyhq/mcp-camoufox/tree/main/docs"
Issues = "https://github.com/agelyhq/mcp-camoufox/issues"

[project.scripts]
camoufox-mcp = "camoufox_mcp.server:main"
camoufox-mcp-daemon = "camoufox_mcp.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_mcp"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["camoufox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A browser that dies mid-call (TargetClosedError) leaves the in-flight MCP request
# awaiting a reply that never comes, and fastmcp's client waits without a timeout —
# so the run hangs forever instead of failing. This bounds every test.
# "thread" (not "signal") because SIGALRM does not exist on Windows.
timeout = 180
timeout_method = "thread"
