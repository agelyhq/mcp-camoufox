[project]
name = "mcp-camoufox"
version = "0.3.3"
description = "Browser automation MCP server that does not get blocked, backed by Camoufox anti-detect Firefox"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-FSL-1.1-MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabien Vauchelles" }]
keywords = ["mcp", "browser-automation", "camoufox", "firefox", "anti-detect", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=3.4.4",
    # camoufox and playwright are bounded together because the Camoufox pin does NOT
    # bound the browser: the launcher resolves the newest GitHub browser release whose
    # release ordinal matches, not a Firefox version, so the binary drifts forward on
    # its own (this machine moved from Firefox 135 to 152.0.4-beta.28 on 2026-07-19
    # under an unchanged `<0.5` pin). Playwright must therefore be held to what the
    # binary's Juggler schema actually implements: 1.61 added `viewport.isMobile` to
    # Browser.setDefaultViewport, which the bundled schema rejects, and every launch
    # failed with a protocol error (2026-07-15 incident, see docs/decisions.md).
    # camoufox 0.5.4 declares `playwright<1.61` itself; stating it here keeps the bound
    # visible and adds the 1.60 floor. CAMOUFOX_BROWSER_VERSION pins the browser build.
    "camoufox[geoip]>=0.5.4,<0.6",
    "playwright>=1.60,<1.61",
    "platformdirs>=4.0",
    "filelock>=3.13",
    "pillow>=10.0",
    # Imported directly by tools/_observe.py for schema metadata. It arrives through
    # fastmcp anyway, but relying on a transitive dependency is how the Playwright
    # drift of 2026-07-15 happened, so it is declared.
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/agelyhq/mcp-camoufox"
Documentation = "https://github.com/agelyhq/mcp-camoufox/tree/main/docs"
Issues = "https://github.com/agelyhq/mcp-camoufox/issues"

[project.scripts]
mcp-camoufox = "camoufox_mcp.server:main"
mcp-camoufox-daemon = "camoufox_mcp.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_mcp"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["**/__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["camoufox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A browser that dies mid-call (TargetClosedError) leaves the in-flight MCP request
# awaiting a reply that never comes, and fastmcp's client waits without a timeout —
# so the run hangs forever instead of failing. This bounds every test.
# "thread" (not "signal") because SIGALRM does not exist on Windows.
timeout = 180
timeout_method = "thread"
