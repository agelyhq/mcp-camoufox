[project]
name = "camoufox-mcp"
version = "0.1.0"
description = "MCP server for Camoufox anti-detect browser"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14",
    "camoufox[geoip]>=0.4",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "moto[s3,server]>=5.0",
]

[project.scripts]
camoufox-mcp = "camoufox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camoufox_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "SIM",
    "TCH",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["camoufox_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
