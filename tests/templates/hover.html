{% extends "base.html" %}
{% block title %}Hover Test{% endblock %}
{% block content %}
<h1>Hover Test</h1>
<div class="section">
  <button id="hover-target"
          onmouseover="document.getElementById('hover-output').textContent = 'hovered'"
          onmouseout="document.getElementById('hover-output').dataset.left = 'yes'">
    Hover me
  </button>
  <div id="hover-output" class="output">not hovered</div>
</div>
{% endblock %}
