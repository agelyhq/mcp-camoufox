<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MCP Test{% endblock %}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; line-height: 1.5; padding: 20px; max-width: 800px; margin: 0 auto; color: #222; }
    h1 { margin-bottom: 16px; font-size: 1.5rem; }
    h2 { margin: 20px 0 10px; font-size: 1.2rem; }
    a { color: #0066cc; }
    .nav { margin-bottom: 20px; font-size: 0.9rem; }
    button { cursor: pointer; padding: 6px 14px; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; font-size: 0.9rem; }
    button:hover { background: #e0e0e0; }
    input[type="text"], input[type="email"], textarea, select {
      padding: 6px 10px; border: 1px solid #aaa; border-radius: 4px; font-size: 0.9rem; width: 100%; max-width: 400px;
    }
    textarea { min-height: 80px; resize: vertical; }
    label { display: block; margin-top: 10px; font-weight: 600; font-size: 0.9rem; }
    .output { margin-top: 12px; padding: 10px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; min-height: 30px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; }
    .section { margin-bottom: 24px; padding: 16px; border: 1px solid #ddd; border-radius: 6px; }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="nav"><a href="/">← Index</a></div>
  {% block content %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
