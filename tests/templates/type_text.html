{% extends "base.html" %}
{% block title %}Type Text Test{% endblock %}
{% block content %}
<h1>Type Text Test</h1>
<div class="section">
  <form id="type-form"
        onsubmit="document.getElementById('type-status').textContent = 'submitted'; return false;">
    <label for="type-input">Search</label>
    <input type="text" id="type-input" placeholder="Type here"
           oninput="document.getElementById('type-output').textContent = this.value">
  </form>
  <div id="type-output" class="output"></div>
  <div id="type-status" class="output"></div>
</div>
{% endblock %}
